  <rect x="4.6" y="4.6" width="54.8" height="54.8" rx="6.6" fill="none" stroke="#C79238" stroke-width="1.7"/>
  <rect x="8.7" y="8.7" width="46.6" height="46.6" rx="4" fill="none" stroke="#C79238" stroke-width="0.7" stroke-opacity="0.5"/>
  <text x="32" y="43.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="35" font-style="italic" fill="#151413">A</text>
  <circle cx="32" cy="51.6" r="1.6" fill="#C79238"/>
</svg>
